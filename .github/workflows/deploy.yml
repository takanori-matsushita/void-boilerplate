# main への push → dev に自動デプロイ。stg / prod は手動実行（GitHub Environments の保護ルールで承認を必須にする）。
# 順序: マイグレーション（管理用ロール）→ デプロイ（DB 資格情報なし）→ 検証
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: デプロイ先の環境
        type: choice
        options: [dev, stg, prod]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'dev' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0（タグではなくコミットで固定する）
        with:
          node-version-file: .node-version
          cache: true # vp install も自動実行される
      - name: マイグレーション（管理用ロール）
        run: node deploy/scripts/cli.mts migrate "${{ inputs.environment || 'dev' }}"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [admin, liff]
    environment: ${{ inputs.environment || 'dev' }}
    # このジョブには DB の資格情報を渡さない（Cloudflare の認証情報のみ）
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0（タグではなくコミットで固定する）
        with:
          node-version-file: .node-version
          cache: true # vp install も自動実行される
      - name: デプロイと検証（${{ matrix.app }}）
        run: node deploy/scripts/cli.mts deploy "${{ inputs.environment || 'dev' }}" "${{ matrix.app }}"
      - name: lock の変更を確認（変更があればコミットする）
        if: always()
        run: |
          if ! git diff --quiet -- deploy/; then
            echo "::warning::deploy/ 配下の void.lock.json が更新されました。差分をコミットしてください。"
            git diff --stat -- deploy/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lock-${{ inputs.environment || 'dev' }}-${{ matrix.app }}
          path: deploy/${{ inputs.environment || 'dev' }}/${{ matrix.app }}/void.lock.json
          if-no-files-found: ignore
