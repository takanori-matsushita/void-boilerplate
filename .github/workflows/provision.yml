# 環境（dev / stg / prod）の初回構築・再実行（べき等）。DB のアプリ用ロールと、Hyperdrive（キャッシュ無効）を用意する。
# DB の資格情報を使うのはこのワークフローとマイグレーションだけ。デプロイは DB 資格情報を持たない。
name: Provision

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 対象の環境
        type: choice
        options: [dev, stg, prod]
        required: true
      set_worker_secrets:
        description: Worker のシークレット DATABASE_URL_ADMIN を設定する（Queue consumer / Cron を使い始めるとき）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: provision-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0（タグではなくコミットで固定する）
        with:
          node-version-file: .node-version
          cache: true # vp install も自動実行される
      - name: DB ロールと Hyperdrive を用意
        run: node deploy/scripts/cli.mts provision "${{ inputs.environment }}"
      - name: Worker のシークレットを設定（admin）
        if: ${{ inputs.set_worker_secrets }}
        run: node deploy/scripts/cli.mts secrets "${{ inputs.environment }}" admin
